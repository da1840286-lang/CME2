                      "failure_class": "SOURCE_ANALYSIS_FAILED",
                      "exit_code": failure_code,
                      "candidate_id": last_failure.get("candidate_id"),
                      "analysis_status": failure_status,
                      "analysis_detail": last_failure.get("detail", ""),
                      "analysis_attempts": attempts,
                      "skipped_candidates": skipped,
                      "transfer_rejections": loop_result.rejections,
                      "last_production_candidate_id": prior_candidate.get("id"),
                      "last_production_report": prior_report,
                      "detail": ("Fallback source analysis failed after prior transfer rejection: "
                                 + failure_status + " - " + str(last_failure.get("detail") or ""))[:1500],
                  }
                  write_ledger(candidates, attempts=attempts, rejections=loop_result.rejections,
                               failure_class="SOURCE_ANALYSIS_FAILED")
                  (out / "source_transfer_attempts.json").write_text(
                      json.dumps({
                          "selection_mode": selection_mode,
                          "rejections": loop_result.rejections,
                          "selected_candidate_id": None,
                          "last_failure_class": "SOURCE_ANALYSIS_FAILED",
                          "last_analysis_failure": last_failure,
                          "last_production_candidate_id": prior_candidate.get("id"),
                          "last_production_failure_class": (prior_report or {}).get("failure_class", ""),
                      }, ensure_ascii=False, indent=2), encoding="utf-8")
                  (out / "live_result.json").write_text(
                      json.dumps(failure, ensure_ascii=False, indent=2), encoding="utf-8")
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("## Source analysis failed after fallback\n\n")
                      summary.write(f"- Failed candidate: {last_failure.get('candidate_id')}\n")
                      summary.write(f"- Analysis status: {failure_status} - {last_failure.get('detail') or '(no detail)'}\n")
                      summary.write(f"- Prior production outcome: {(prior_report or {}).get('failure_class', 'unknown')}\n")
                      summary.write("- Previous transfer rejections remain listed separately in live_result.json and source_transfer_attempts.json.\n\n")
                  raise SystemExit(failure_code)

              if loop_result.selected is None or loop_result.report is None:
                  details = "; ".join(loop_result.skipped[-5:]) or "no eligible candidate completed analysis"
                  raise SystemExit("No candidate reached production: " + details)
              candidate = loop_result.selected
              cid = str(candidate.get("id") or "").strip()
              status = loop_result.payload["status"]
              analysis = loop_result.payload["analysis"]
              saved = loop_result.payload["saved"]
              report = loop_result.report
              transfer_rejections = loop_result.rejections

              score = candidate.get("source_score") or {}
              score = score if isinstance(score, dict) else {}
              selection = {"candidate_id": cid, "selection_mode": selection_mode,
                           "brand": candidate.get("brand_name") or candidate.get("brand"),
                           "title": candidate.get("title"), "source_url": candidate.get("source_url"),
                           "video_url_present": bool(candidate.get("video_url")),
                           "source_check": candidate.get("source_check"), "source_score": score,
                           "analysis_attempts": len(attempts)}
              (out / "selected_candidate.json").write_text(
                  json.dumps(selection, ensure_ascii=False, indent=2), encoding="utf-8")
              (out / "source_analysis.json").write_text(
                  json.dumps(analysis, ensure_ascii=False, indent=2), encoding="utf-8")
              (out / "source_analysis_attempts.json").write_text(
                  json.dumps({"selection_mode": selection_mode, "max_candidates": analysis_limit,
                              "attempts": attempts, "skipped": skipped,
                              "selected_candidate_id": cid}, ensure_ascii=False, indent=2), encoding="utf-8")
              (out / "source_transfer_attempts.json").write_text(
                  json.dumps({"selection_mode": selection_mode, "rejections": transfer_rejections,
                              "selected_candidate_id": cid,
                              "last_failure_class": report.get("failure_class", "")},
                             ensure_ascii=False, indent=2), encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## Transfer-decision fallback\n\n")
                  for item in transfer_rejections:
                      summary.write(f"- {item['candidate_id']}: {item['reason'] or 'TRANSFER_REJECTED'}\n")
                  summary.write(f"\nFinal candidate: `{cid}`; manual selection is never replaced.\n\n")
              work_prod = work / "production" / report["run_id"]
              dest = out / "production" / report["run_id"]
              if work_prod.is_dir():
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copytree(work_prod, dest, dirs_exist_ok=True)
                  (dest / "source_contract.json").unlink(missing_ok=True)
              calls = work / "calls.jsonl"
              if calls.is_file():
                  shutil.copy2(calls, out / "radar-analysis-calls.jsonl")
              verdict_values = report.get("verdicts", []) or []
              verdict_text = json.dumps(verdict_values, ensure_ascii=False).upper()
              status_text = str(report.get("status", "")).upper()
              if status_text == "OK" and report.get("exit_code") == 0:
                  failure_class = "DELIVERED_PASS"
              elif report.get("failure_class") == "TRANSFER_REJECTED":
                  failure_class = "TRANSFER_REJECTED"
              elif report.get("failure_class"):
                  # Keep provider, contract and QA failure classes from run_result.json intact.
                  failure_class = str(report.get("failure_class"))
              elif "UNVERIFIED" in verdict_text or status_text == "UNVERIFIED":
                  failure_class = "QA_UNVERIFIED"
              elif "NOT_DELIVERED" in verdict_text or status_text == "NOT_DELIVERED":
                  failure_class = "NOT_DELIVERED"
              elif "FAILED_QA" in verdict_text or status_text == "FAILED_QA":
                  failure_class = "VISUAL_QA_FAILED"
              elif status_text in {"API_ERROR", "PROVIDER_ERROR", "INFRA_ERROR"}:
                  failure_class = "INFRASTRUCTURE_OR_PROVIDER_ERROR"
              else:
                  failure_class = "PRODUCTION_OR_CONTRACT_ERROR"
              weak_reasons = weak_source_reasons(candidate, threshold)
              ledger_rows = write_ledger(candidates, attempts=attempts, rejections=transfer_rejections, selected_id=cid,
                                         failure_class=failure_class, verdicts=verdict_values)
              ranked_row = next((row for row in ledger_rows if row["candidate_id"] == cid), {})
              brief = {"status": report.get("status"), "run_id": report.get("run_id"), "candidate_id": cid,
                       "selection_mode": selection_mode, "analysis_id": status.get("analysis_id"), "exit_code": report.get("exit_code"),
                       "failure_class": failure_class,
                       "weak_source": bool(weak_reasons), "weak_source_reasons": weak_reasons,
                       "source_rank": ranked_row.get("rank"), "source_threshold": threshold_info,
                       "offer_name": report.get("offer_name"), "images": report.get("images", []),
                       "verdicts": verdict_values, "provider_calls_made": report.get("provider_calls_made", 0),
                       "stdout_tail": report.get("stdout_tail", ""), "stderr_tail": report.get("stderr_tail", ""),
                       "transfer_rejections": transfer_rejections}
              (out / "live_result.json").write_text(json.dumps(brief, ensure_ascii=False, indent=2), encoding="utf-8")
              print(json.dumps(brief, ensure_ascii=False, indent=2))
              code = report.get("exit_code")
              if report.get("status") != "OK" or code != 0:
                  raise SystemExit(int(code) if isinstance(code, int) and code else 7)
          finally:
              app.store.close()
              shutil.rmtree(work, ignore_errors=True)
          PY
          elif [[ "$CME_STAGE" == "brain" ]]; then
            python -m cme.smoke brain --offer out/live_offer.json --source-contract out/source_contract.json --shots "$SHOTS" --brief "$(read_brief)" --out out
          elif [[ "$CME_STAGE" == "all" ]]; then
            python -m cme.smoke all --offer out/live_offer.json --source-contract out/source_contract.json --shots "$SHOTS" --brief "$(read_brief)" --out out
          else
            attempt=1
            if [[ -s out/state.json ]]; then
              attempt="$(python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path("out/state.json").read_text(encoding="utf-8"))
          requested_shot = int(os.environ.get("CME_SHOT", "1"))
          used = sum(1 for item in state.get("attempts", []) if item.get("shot") == requested_shot and item.get("receipt_id"))
          print(used + 1)
          PY
              )"
            fi
            args=(python -m cme.smoke frame --offer out/live_offer.json --out out --shot "$CME_SHOT" --attempt "$attempt")
            if [[ "$NO_OCR_REQUIRED" == "true" ]]; then
              args+=(--no-ocr-required)
            fi
            "${args[@]}"
          fi
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          {
            echo "## CME live pipeline result"
            echo "- Stage: $CME_STAGE"
            echo "- Workflow run ID: ${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- CME exit code: $result"
            if [[ "$CME_STAGE" == "find" && "$result" == "0" ]]; then
              echo "- Next: select candidate_id from this summary, then run stage=analyze with this run ID in find_run_id to inspect the source without generating images."
            elif [[ "$CME_STAGE" == "brain" && "$result" == "0" ]]; then
              echo "- Next: inspect atoms.json, then run stage=frame with this run ID."
            elif [[ "$result" == "6" ]]; then
              echo "- QA verdict: UNVERIFIED; artifacts retained."
            elif [[ "$result" == "7" ]]; then
              echo "- QA verdict: FAILED_QA or NOT_DELIVERED; artifacts retained."
            elif [[ "$CME_STAGE" == "all" && "$result" == "0" ]]; then
              echo "- Pipeline completed. Inspect each generated image and receipt before commercial use."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Check whether this run executed FIND before saving source history
        id: find_state_persist
        if: always() && (inputs.stage == 'find' || inputs.stage == 'all')
        shell: bash
        run: |
          state_dir="${RUNNER_TEMP}/cme-find-state"
          should_save=false
          if [[ -f "$state_dir/find-completed" && -s "$state_dir/seen.json" ]]; then
            should_save=true
          fi
          rm -f "$state_dir/find-completed"
          echo "should_save=$should_save" >> "$GITHUB_OUTPUT"
          echo "FIND source-history persistence: $should_save"

      - name: Save FIND source history
        if: always() && (inputs.stage == 'find' || inputs.stage == 'all') && steps.find_state_persist.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cme-find-state
          key: cme-find-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Check verified product-reference cache before saving
        id: reference_cache_persist
        if: always() && (inputs.stage == 'frame' || inputs.stage == 'all')
        shell: bash
        run: |
          cache_dir="${RUNNER_TEMP}/cme-reference-cache"
          should_save=false
          if [[ -d "$cache_dir" ]] && find "$cache_dir" -maxdepth 1 -type f -name '*.prep.json' -print -quit | grep -q .; then
            should_save=true
          fi
          echo "should_save=$should_save" >> "$GITHUB_OUTPUT"
          echo "Verified product-reference cache persistence: $should_save"

      - name: Save verified product-reference cache
        if: always() && (inputs.stage == 'frame' || inputs.stage == 'all') && steps.reference_cache_persist.outputs.should_save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cme-reference-cache
          key: cme-reference-cache-${{ runner.os }}-${{ hashFiles('examples/**', 'cme/branding.py') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove raw source-transfer input from downloadable artifacts
        if: always() && inputs.stage != 'frame' && inputs.stage != 'analyze'
        run: rm -f out/source_contract.json

      - name: Upload output, receipts, state, and call log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cme-${{ inputs.stage }}-out
          path: out/
          if-no-files-found: warn
          retention-days: 7

      - name: Apply CME result as workflow status
        if: always() && steps.smoke.outcome == 'success'
        shell: bash
        run: |
          code="${{ steps.smoke.outputs.exit_code }}"
          if [[ -z "$code" ]]; then
            echo "::error::The smoke command did not record an exit code."
            exit 1
          fi
          if [[ "$code" != "0" ]]; then
            echo "::error::CME live stage exited with code $code. Artifacts uploaded where available."
            exit "$code"
          fi
