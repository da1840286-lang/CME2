name: CME Live Control Center — pre-Layer 3
run-name: CME pre-Layer-3 — ${{ inputs.stage }}

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Run FIND, analyze a selected source, run Brain/frame checks, or create a test creative. Automatic ALL analyzes the FIND shortlist in FIND order using PATTERN_SOURCE_V1; commercial metrics are diagnostics and Target-Fit decides transferability. Manual candidate_id selects one FIND source but cannot bypass PATTERN_SOURCE_V1."
        type: choice
        options:
          - find
          - analyze
          - brain
          - frame
          - all
        required: true
        default: all
      country:
        description: "TikTok FIND country, two-letter code"
        type: string
        required: true
        default: "US"
      period:
        description: "Lookback period in days for supported source-age filtering and attention scoring; this does not create playback metrics."
        type: choice
        options:
          - "7"
          - "30"
          - "180"
        required: true
        default: "30"
      find_requests:
        description: "Hard cap on SocialCrawl requests. Product mode uses up to three target-focused Sponsored Search queries and does not call Ads Top performance boards. Views/likes/comments/shares are metadata only, never selection criteria. Target-Fit and mechanism analysis are downstream."
        type: number
        required: true
        default: 4
      find_max_ads:
        description: "Maximum eligible TikTok source videos to return (provider relevance order)"
        type: number
        required: true
        default: 3
      find_video_duration_range:
        description: "FIND video-duration filter. A selected range excludes records with unknown duration; it does not change provider request budgets or downstream stages."
        type: choice
        options:
          - all
          - up_to_40
          - 40_to_60
          - 60_to_90
          - over_90
        required: true
        default: all
      keywords:
        description: "Comma-separated fallback/generic search terms. In contract-aware product search, the exact offer name and product type are prioritized before these terms."
        type: string
        required: false
        default: "car vacuum"
      find_performance_order:
        description: "Optional playback-metric diagnostic. In Product mode no Ads Top playback/performance board is used because it is not reliably product-targeted and does not return numeric play-rate values. Requested rates are explicitly reported as NOT_OBTAINABLE_FOR_PRODUCT_QUERY. default still uses target-focused Sponsored Search; engagement never gates or ranks sources."
        type: choice
        options:
          - default
          - play_6s_rate
          - play_2s_rate
          - playback_both
        required: true
        default: default
      find_include_retention:
        description: "Requires a playback-metric option, but the current contract-aware plan intentionally skips unfiltered Ads Top retention calls when play_2s_rate or play_6s_rate is requested. A true value does not override this provider limitation; leave false for the current product-targeted FIND path."
        type: boolean
        required: false
        default: false
      find_selection_mode:
        description: "Product searches and selects playable ads that independently advertise the configured target product. Mechanism searches explicit keywords for promoted adjacent products. Neither mode uses views/likes/comments/shares to admit or rank candidates; those fields are metadata only."
        type: choice
        options:
          - product
          - mechanism
        required: true
        default: product
      find_run_id:
        description: "For analyze/all: numeric run ID of a completed FIND run"
        type: string
        required: false
        default: ""
      candidate_id:
        description: "For analyze/all: exact candidate_id from FIND. Manual selection overrides automatic order only; PATTERN_SOURCE_V1 video, role, promotion and explicit operator filters still apply. It is not proof of commercial success."
        type: string
        required: false
        default: ""
      branding_policy:
        description: "Single campaign branding selector: no_branding removes all product marks; target_brand_allowed preserves only confirmed target-brand marks. Frame inherits its exact Brain contract."
        type: choice
        options:
          - no_branding
          - target_brand_allowed
        required: true
        default: no_branding
      offer_json:
        description: "Target OfferCard facts and approved_brand_marks. Branding mode is controlled only by the separate branding_policy menu; any branding_policy field in this JSON is ignored."
        type: string
        required: false
        default: '{"offer_id":"fanttik-v8-mate-us-001","name":"Fanttik V8 Mate Cordless Car Vacuum","product_type":"cordless handheld car vacuum","verified_claims":["Cordless car vacuum"],"forbidden_claims":["guaranteed","medical","cures"],"photos":[],"platform":"","geo":"US","product_category":"","confirmations":[],"approved_brand_marks":[]}'
      target_photo_url:
        description: "Direct HTTPS image URL; downloaded during the workflow, not committed to the repository"
        type: string
        required: false
        default: ""
      source_contract_json:
        description: "Optional manual JSON input for brain/all. Prefer source_contract_run_id to load the Analyze artifact automatically."
        type: string
        required: false
        default: ""
      source_contract_run_id:
        description: "For brain/all: numeric ID of a successful analyze run. Automatically loads source_contract.json from its cme-analyze-out artifact; avoids manual JSON copy/paste."
        type: string
        required: false
        default: ""
      shots:
        description: "Number of sequential frames for brain/all (1-6; keep at 1 for first live run)"
        type: number
        required: true
        default: 1
      shot:
        description: "For frame stage: shot number to generate from the accepted Brain contract (1-6)"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "5"
          - "6"
        required: true
        default: "1"
      brief:
        description: "Target-native production brief; source mechanism is carried separately from source_contract_json"
        type: string
        required: true
        default: "Create target-native vertical 9:16 product-ad frames. Preserve the source's causal commercial mechanism, but replace its product, brand, creator, props, scene, wording and composition. Show the configured target product clearly and use only verified OfferCard facts."
      brain_run_id:
        description: "Required for frame; numeric run ID of a successful Brain stage from this branch. The atom manifest is revalidated before generation."
        type: string
        required: false
        default: ""
      previous_frame_run_id:
        description: "Optional prior frame run ID for a controlled retry; restores state and attempt limits"
        type: string
        required: false
        default: ""
      no_ocr_required:
        description: "Make OCR's no-text check optional; a missing required check can still leave QA UNVERIFIED"
        type: boolean
        required: false
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: cme-live-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      CME_REPOSITORY: ${{ github.repository }}
      CME_STAGE: ${{ inputs.stage }}
      CME_BRANDING_POLICY: ${{ inputs.branding_policy }}
      FIND_RUN_ID: ${{ inputs.find_run_id }}
      CANDIDATE_ID: ${{ inputs.candidate_id }}
      SOURCE_CONTRACT_PROVIDED: ${{ inputs.source_contract_json != '' || inputs.source_contract_run_id != '' }}
      FIND_COUNTRY: ${{ inputs.country }}
      FIND_PERIOD: ${{ inputs.period }}
      FIND_REQUESTS: ${{ inputs.find_requests }}
      FIND_MAX_ADS: ${{ inputs.find_max_ads }}
      FIND_VIDEO_DURATION_RANGE: ${{ inputs.find_video_duration_range }}
      FIND_KEYWORDS: ${{ inputs.keywords }}
      FIND_SELECTION_MODE: ${{ inputs.find_selection_mode }}
      FIND_PERFORMANCE_ORDER: ${{ inputs.find_performance_order }}
      FIND_INCLUDE_RETENTION: ${{ inputs.find_include_retention }}
      SHOTS: ${{ inputs.shots }}
      CME_SHOT: ${{ inputs.shot }}
      BRAIN_RUN_ID: ${{ inputs.brain_run_id }}
      PREVIOUS_FRAME_RUN_ID: ${{ inputs.previous_frame_run_id }}
      NO_OCR_REQUIRED: ${{ inputs.no_ocr_required }}
    steps:
      - name: Check out selected branch and commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore FIND source history
        if: inputs.stage == 'find' || inputs.stage == 'all'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cme-find-state
          key: cme-find-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            cme-find-state-${{ runner.os }}-${{ github.ref_name }}-
      - name: Initialize FIND source history
        if: inputs.stage == 'find' || inputs.stage == 'all'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/cme-find-state"
          echo "CME_FIND_STATE_DIR=${RUNNER_TEMP}/cme-find-state" >> "$GITHUB_ENV"
          echo "CME_FIND_SEEN_PATH=${RUNNER_TEMP}/cme-find-state/seen.json" >> "$GITHUB_ENV"
          rm -f "${RUNNER_TEMP}/cme-find-state/find-completed"
          if [[ ! -s "${RUNNER_TEMP}/cme-find-state/seen.json" ]]; then
            printf '{"version":1,"entries":{}}\n' > "${RUNNER_TEMP}/cme-find-state/seen.json"
          fi

      - name: Restore verified product-reference cache
        if: inputs.stage == 'frame' || inputs.stage == 'all'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cme-reference-cache
          key: cme-reference-cache-${{ runner.os }}-${{ hashFiles('examples/**', 'cme/branding.py') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cme-reference-cache-${{ runner.os }}-${{ hashFiles('examples/**', 'cme/branding.py') }}-
      - name: Initialize verified product-reference cache
        if: inputs.stage == 'frame' || inputs.stage == 'all'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/cme-reference-cache"
          echo "CME_REFERENCE_CACHE_DIR=${RUNNER_TEMP}/cme-reference-cache" >> "$GITHUB_ENV"

      - name: Install project dependencies
        timeout-minutes: 5
        run: python -m pip install --disable-pip-version-check --retries 1 --timeout 20 -r requirements.txt

      - name: Install Tesseract for strict branding cleanup
        if: inputs.stage == 'brain' || inputs.stage == 'frame' || inputs.stage == 'all'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Verify FFmpeg runtime for GitHub-only source-video analysis
        if: (inputs.stage == 'all' && inputs.source_contract_json == '' && inputs.source_contract_run_id == '') || inputs.stage == 'analyze'
        timeout-minutes: 1
        run: |
          python - <<'PY'
          from cme.radar.analyze import ffmpeg_executable, tools_status
          status = tools_status()
          if status["state"] != "READY":
              raise SystemExit(f"FFmpeg runtime unavailable: {status['detail']}")
          print(f"FFmpeg runtime ready: {ffmpeg_executable()}")
          PY

      - name: Create controlled runtime settings
        run: |
          set -euo pipefail
          mkdir -p out
          cp settings.example.json settings.json

      - name: Validate target offer and download target photo before provider calls
        if: inputs.stage == 'brain' || inputs.stage == 'all'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, urllib.error, urllib.request, zipfile
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urlsplit
          from PIL import Image
          from cme.brain import build_source_transfer_context
          from cme.branding import BRANDING_POLICIES
          from cme.offer import load_offer
          from cme.qa import validate_product_references

          root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          out = (root / "out").resolve()
          event_payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          dispatch_inputs = event_payload.get("inputs") or {}
          raw_offer = str(dispatch_inputs.get("offer_json") or "").strip()
          raw_source = str(dispatch_inputs.get("source_contract_json") or "").strip()
          source_run_id = str(dispatch_inputs.get("source_contract_run_id") or "").strip()
          selected_candidate = os.environ.get("CANDIDATE_ID", "").strip()
          photo_url = str(dispatch_inputs.get("target_photo_url") or "").strip()
          if not raw_offer:
              raise SystemExit("offer_json is required.")
          stage = os.environ.get("CME_STAGE", "")
          if raw_source and source_run_id:
              raise SystemExit("Use only one source input: source_contract_json or source_contract_run_id.")
          if stage == "brain" and not raw_source and not source_run_id:
              raise SystemExit("Brain-only stage requires source_contract_json or source_contract_run_id from a successful analyze run.")
          if stage == "all" and selected_candidate and not os.environ.get("FIND_RUN_ID", "").strip():
              raise SystemExit("A manually selected candidate_id requires find_run_id from the FIND stage.")
          if stage == "all" and selected_candidate and (raw_source or source_run_id):
              raise SystemExit(
                  "Conflicting stage=all inputs: choose either candidate_id from FIND (which creates a source contract "
                  "from that candidate's analysis) or source_contract_json/source_contract_run_id, not both."
              )

          # Prefer fetching the canonical source_contract.json from the Analyze artifact to avoid manual copy/paste.
          if source_run_id:
              if not re.fullmatch(r"[0-9]{1,20}", source_run_id):
                  raise SystemExit("source_contract_run_id must be the numeric ID of a completed Analyze run.")
              token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN")
              if not token:
                  raise SystemExit("GitHub token unavailable; cannot fetch the Analyze artifact.")
              api_base = f"https://api.github.com/repos/{os.environ['CME_REPOSITORY']}"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "CME-source-contract-loader",
              }

              class StripAuthorizationOnCrossHostRedirect(urllib.request.HTTPRedirectHandler):
                  """GitHub API redirects artifact ZIP requests to signed storage URLs.

                  The GitHub bearer token must not be forwarded to that other host; the
                  signed redirect URL already authorizes the storage request.
                  """
                  def redirect_request(self, req, fp, code, msg, headers, newurl):
                      redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                      if redirected is not None and urlsplit(req.full_url).netloc.lower() != urlsplit(newurl).netloc.lower():
                          redirected.remove_header("Authorization")
                          redirected.remove_header("Cookie")
                          redirected.unredirected_hdrs.pop("Authorization", None)
                          redirected.unredirected_hdrs.pop("Cookie", None)
                      return redirected

              artifact_opener = urllib.request.build_opener(StripAuthorizationOnCrossHostRedirect())
              try:
                  req = urllib.request.Request(
                      f"{api_base}/actions/runs/{source_run_id}/artifacts?per_page=100", headers=headers)
                  with artifact_opener.open(req, timeout=30) as response:
                      artifact_index = json.loads(response.read(5 * 1024 * 1024 + 1).decode("utf-8"))
                  artifacts = artifact_index.get("artifacts", []) if isinstance(artifact_index, dict) else []
                  artifact = next((a for a in artifacts
                                   if a.get("name") == "cme-analyze-out" and not a.get("expired")), None)
                  if artifact is None:
                      available = ", ".join(str(a.get("name")) for a in artifacts[:20])
                      raise SystemExit(
                          f"Run {source_run_id} has no unexpired cme-analyze-out artifact. "
                          f"Artifacts found: {available or '(none)'}")
                  req = urllib.request.Request(str(artifact["archive_download_url"]), headers=headers)
                  with artifact_opener.open(req, timeout=30) as response:
                      archive_bytes = response.read(25 * 1024 * 1024 + 1)
                  if len(archive_bytes) > 25 * 1024 * 1024:
                      raise SystemExit("Analyze artifact ZIP exceeds 25 MB.")
                  with zipfile.ZipFile(BytesIO(archive_bytes)) as archive:
                      members = [name for name in archive.namelist()
                                 if name == "source_contract.json" or name.endswith("/source_contract.json")]
                      if len(members) != 1:
                          raise SystemExit(
                              f"Analyze artifact must contain exactly one source_contract.json; found {len(members)}.")
                      raw_source = archive.read(members[0]).decode("utf-8")
              except (OSError, urllib.error.URLError, ValueError, KeyError, zipfile.BadZipFile) as exc:
                  raise SystemExit(
                      f"Could not load source_contract.json from Analyze run {source_run_id}: "
                      f"{type(exc).__name__}: {exc}") from exc

          # In stage=all, no source input means FIND + ranked automatic selection in this same run.
          try:
              offer_data = json.loads(raw_offer)
              source_data = json.loads(raw_source) if raw_source else None
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Invalid JSON (line {exc.lineno}, column {exc.colno}): {exc.msg}") from exc
          if not isinstance(offer_data, dict):
              raise SystemExit("offer_json must be a JSON object")
          branding_policy = os.environ.get("CME_BRANDING_POLICY", "").strip().lower()
          if branding_policy not in BRANDING_POLICIES:
              raise SystemExit(
                  "Select branding_policy in the workflow menu: no_branding or target_brand_allowed. "
                  "The run will not silently choose a branding mode."
              )
          json_policy = offer_data.pop("branding_policy", None)
          if json_policy and str(json_policy).strip().lower() != branding_policy:
              print(
                  f"Ignoring offer_json.branding_policy={json_policy!r}; "
                  f"workflow menu selected {branding_policy!r} and is the sole policy source."
              )
          offer_data["branding_policy"] = branding_policy
          if not isinstance(offer_data.get("approved_brand_marks", []), list):
              raise SystemExit("OfferCard.approved_brand_marks must be a JSON array")
          if source_data is not None and not isinstance(source_data, dict):
              raise SystemExit("source_contract_json must be a JSON object")

          if photo_url:
              parsed = urlsplit(photo_url)
              if parsed.scheme != "https" or not parsed.hostname or parsed.hostname.lower() in {"localhost", "127.0.0.1", "::1"}:
                  raise SystemExit("target_photo_url must be a direct HTTPS image URL, not a product page.")
              req = urllib.request.Request(photo_url, headers={"User-Agent": "Mozilla/5.0", "Accept": "image/*"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      content_type = response.headers.get_content_type()
                      image_bytes = response.read(15 * 1024 * 1024 + 1)
              except (OSError, urllib.error.URLError) as exc:
                  raise SystemExit(f"Could not download target_photo_url: {type(exc).__name__}: {exc}") from exc
              if len(image_bytes) > 15 * 1024 * 1024:
                  raise SystemExit("Target photo exceeds 15 MB; use a smaller image.")
              if not content_type.startswith("image/"):
                  raise SystemExit(f"target_photo_url returned {content_type}, not an image. Use the direct image URL.")
              with Image.open(BytesIO(image_bytes)) as image:
                  image.verify()
              (out / "target_product_reference.jpg").write_bytes(image_bytes)
              offer_data["photos"] = ["target_product_reference.jpg"]
          else:
              photos = offer_data.get("photos")
              if not isinstance(photos, list) or not photos:
                  raise SystemExit("Provide target_photo_url or OfferCard.photos pointing to real images in this branch.")
              normalized = []
              for raw in photos:
                  if not isinstance(raw, str) or not raw.strip():
                      raise SystemExit("Every OfferCard.photos entry must be a non-empty path")
                  item = Path(raw)
                  if item.is_absolute():
                      raise SystemExit("OfferCard.photos must use repository-relative paths")
                  photo = (root / item).resolve()
                  if not photo.is_relative_to(root) or not photo.is_file():
                      raise SystemExit(f"Photo is not present in this branch: {raw}")
                  normalized.append(os.path.relpath(photo, out))
              offer_data["photos"] = normalized

          offer_path = out / "live_offer.json"
          offer_path.write_text(json.dumps(offer_data, ensure_ascii=False, indent=2), encoding="utf-8")
          offer = load_offer(offer_path)
          # Persist the exact effective allowlist resolved by OfferCard. Every downstream
          # stage consumes this normalized file; the menu value is not re-read later.
          offer_data["approved_brand_marks"] = list(offer.approved_brand_marks)
          offer_path.write_text(json.dumps(offer_data, ensure_ascii=False, indent=2), encoding="utf-8")
          issues = validate_product_references(offer.photos)
          if issues:
              raise SystemExit("Target-photo preflight blocked before provider calls: " + "; ".join(issues))
          if source_data is not None:
              # Pattern extraction is not commercial approval, but that is not a blocker
              # for making a test creative. Validate the extracted mechanism below instead.
              if source_data.get("candidate_id") and str(source_data.get("status", "")).upper() != "OK":
                  raise SystemExit("Saved Radar analysis wrapper must have status=OK before transfer")
              context = build_source_transfer_context(source_data)
              meaningful = ("mechanism_hypothesis", "transferability_hypothesis", "mechanism", "mechanism_representation",
                            "transfer", "rebuild_plan", "image_creative_contract", "hook", "buyer_problem", "product_intervention")
              if not any(context.get(key) for key in meaningful):
                  raise SystemExit("Source contract contains no usable mechanism/transfer evidence")
              (out / "source_contract.json").write_text(json.dumps(source_data, ensure_ascii=False, indent=2), encoding="utf-8")
          effective_marks = ", ".join(offer.approved_brand_marks) or "(none)"
          print(
              f"Preflight PASS: offer={offer.offer_id}; branding_policy={offer.branding_policy}; "
              f"approved_target_marks={effective_marks}; target photo(s)={len(offer.photos)}."
          )
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Campaign branding contract\\n\\n")
              summary.write(f"- Workflow menu selection: {offer.branding_policy}\\n")
              summary.write(f"- Approved target-brand marks: {effective_marks}\\n")
              summary.write("- This normalized OfferCard is the single source consumed by Brain, Frame, generation and QA.\\n\\n")
          print("No provider calls were made by this preflight step.")
          PY

      - name: Validate credentials, FIND parameters, and previous-run provenance
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$CME_STAGE" == "all" && "$FIND_SELECTION_MODE" == "mechanism" && -z "$CANDIDATE_ID" && "$SOURCE_CONTRACT_PROVIDED" != "true" ]]; then
            echo "::error::Mechanism mode discovers adjacent pattern candidates; it cannot auto-approve commercial transfer. Run stage=find, then explicitly choose a candidate for stage=analyze/all, or provide a reviewed source contract."
            exit 1
          fi
          case "$CME_STAGE" in
            find)
              [[ -n "${SOCIALCRAWL_API_KEY:-}" ]] || { echo "::error::Add SOCIALCRAWL_API_KEY in repository Actions secrets."; exit 1; }
              [[ "$FIND_COUNTRY" =~ ^[A-Za-z]{2}$ ]] || { echo "::error::country must be a two-letter code such as US."; exit 1; }
              [[ "$FIND_PERIOD" =~ ^(7|30|180)$ ]] || { echo "::error::period must be 7, 30, or 180."; exit 1; }
              [[ "$FIND_REQUESTS" =~ ^([1-9]|10)$ ]] || { echo "::error::find_requests must be 1..10."; exit 1; }
              [[ "$FIND_MAX_ADS" =~ ^([1-9]|[1-4][0-9]|50)$ ]] || { echo "::error::find_max_ads must be 1..50."; exit 1; }
              [[ "$FIND_VIDEO_DURATION_RANGE" =~ ^(all|up_to_40|40_to_60|60_to_90|over_90)$ ]] || { echo "::error::find_video_duration_range is invalid."; exit 1; }
              if [[ "$FIND_SELECTION_MODE" == "mechanism" && "$FIND_PERFORMANCE_ORDER" != "default" ]]; then
                echo "::error::Mechanism mode uses Sponsored Search only; choose find_performance_order=default."
                exit 1
              fi
              ;;
            analyze)
              [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo "::error::Add OPENROUTER_API_KEY in Actions secrets."; exit 1; }
              [[ "$FIND_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::analyze requires find_run_id from a completed FIND run."; exit 1; }
              [[ -n "$CANDIDATE_ID" ]] || { echo "::error::analyze requires the exact candidate_id from FIND."; exit 1; }
              ;;
            brain)
              [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo "::error::Add OPENROUTER_API_KEY in Actions secrets."; exit 1; }
              ;;
            frame)
              [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo "::error::Add OPENROUTER_API_KEY (Judge) in Actions secrets."; exit 1; }
              [[ -n "${HF_TOKEN:-}" ]] || { echo "::error::Add HF_TOKEN (Hugging Face) in Actions secrets."; exit 1; }
              [[ "$BRAIN_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::For frame, enter the numeric run ID from successful Brain."; exit 1; }
              [[ "$CME_SHOT" =~ ^[1-6]$ ]] || { echo "::error::shot must be 1..6."; exit 1; }
              if [[ -n "$PREVIOUS_FRAME_RUN_ID" && ! "$PREVIOUS_FRAME_RUN_ID" =~ ^[0-9]+$ ]]; then
                echo "::error::previous_frame_run_id must be numeric."; exit 1
              fi
              if [[ "$CME_SHOT" -gt 1 && -z "$PREVIOUS_FRAME_RUN_ID" ]]; then
                echo "::error::shot 2+ requires previous_frame_run_id from a successful frame run."; exit 1
              fi
              ;;
            all)
              [[ -n "${OPENROUTER_API_KEY:-}" ]] || { echo "::error::Add OPENROUTER_API_KEY in Actions secrets."; exit 1; }
              [[ -n "${HF_TOKEN:-}" ]] || { echo "::error::Add HF_TOKEN in Actions secrets."; exit 1; }
              [[ "$SHOTS" =~ ^[1-6]$ ]] || { echo "::error::shots must be 1..6."; exit 1; }
              if [[ -n "$CANDIDATE_ID" ]]; then
                [[ "$FIND_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::candidate_id requires find_run_id from FIND."; exit 1; }
              elif [[ "$SOURCE_CONTRACT_PROVIDED" != "true" ]]; then
                [[ -n "${SOCIALCRAWL_API_KEY:-}" ]] || { echo "::error::Add SOCIALCRAWL_API_KEY for automatic FIND."; exit 1; }
                [[ "$FIND_COUNTRY" =~ ^[A-Za-z]{2}$ ]] || { echo "::error::country must be a two-letter code such as US."; exit 1; }
                [[ "$FIND_PERIOD" =~ ^(7|30|180)$ ]] || { echo "::error::period must be 7, 30, or 180."; exit 1; }
                [[ "$FIND_REQUESTS" =~ ^([1-9]|10)$ ]] || { echo "::error::find_requests must be 1..10."; exit 1; }
                [[ "$FIND_MAX_ADS" =~ ^([1-9]|[1-4][0-9]|50)$ ]] || { echo "::error::find_max_ads must be 1..50."; exit 1; }
                [[ "$FIND_VIDEO_DURATION_RANGE" =~ ^(all|up_to_40|40_to_60|60_to_90|over_90)$ ]] || { echo "::error::find_video_duration_range is invalid."; exit 1; }
                if [[ "$FIND_SELECTION_MODE" == "mechanism" && "$FIND_PERFORMANCE_ORDER" != "default" ]]; then
                  echo "::error::Mechanism mode uses Sponsored Search only; choose find_performance_order=default."
                  exit 1
                fi
              fi
              ;;
            *) echo "::error::Unknown stage: $CME_STAGE"; exit 1 ;;
          esac
          if [[ "$CME_STAGE" == "frame" || "$CME_STAGE" == "analyze" || ( "$CME_STAGE" == "all" && -n "$CANDIDATE_ID" ) ]]; then
            python - <<'PY'
          import json, os, urllib.error, urllib.request
          repo = os.environ["CME_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GH_TOKEN"]

          def api(url):
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"GitHub API rejected run/artifact lookup ({exc.code}); check run ID and Actions permissions") from exc

          def check_run(run_id, artifact_name, require_success, allow_prior_commit=False):
              run = api(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
              if run.get("path") != ".github/workflows/live-smoke.yml":
                  raise SystemExit(f"Run {run_id} was not created by CME live-smoke workflow")
              if run.get("head_branch") != branch:
                  raise SystemExit(f"Run {run_id} belongs to another branch. Use a FIND artifact from {branch}.")
              if run.get("head_sha") != sha and not allow_prior_commit:
                  raise SystemExit(f"Run {run_id} belongs to another commit. Repeat FIND/Brain on {branch} at {sha[:12]}.")
              if run.get("status") != "completed":
                  raise SystemExit(f"Run {run_id} has not completed")
              if require_success and run.get("conclusion") != "success":
                  raise SystemExit(f"Required run {run_id} failed (conclusion={run.get('conclusion')})")
              artifacts = api(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts").get("artifacts", [])
              if not any(a.get("name") == artifact_name and not a.get("expired") for a in artifacts):
                  raise SystemExit(f"Run {run_id} has no unexpired {artifact_name} artifact")

          if os.environ["CME_STAGE"] == "frame":
              # A frame consumes a compiled atom contract, not the Brain implementation itself.
              # Permit a previous successful Brain run on this same branch; the downloaded
              # manifest is validated against the current code and OfferCard before generation.
              check_run(os.environ["BRAIN_RUN_ID"], "cme-brain-out", True, allow_prior_commit=True)
              prior = os.environ.get("PREVIOUS_FRAME_RUN_ID", "").strip()
              if prior:
                  # Controlled retries may reuse frame state from an earlier commit, but only
                  # when the contract fingerprints match exactly in the restore/preflight steps.
                  check_run(prior, "cme-frame-out", int(os.environ.get("CME_SHOT", "1")) > 1,
                            allow_prior_commit=True)
          elif os.environ["CME_STAGE"] == "analyze":
              # FIND is data input, not a compiled contract: permit an earlier commit on
              # the same branch so the current run can analyse an already-paid-for search.
              check_run(os.environ["FIND_RUN_ID"], "cme-find-out", True, allow_prior_commit=True)
          else:
              # FIND candidate lists are source data, not compiled contracts. Reuse a
              # successful FIND artifact from an earlier commit on this same branch.
              check_run(os.environ["FIND_RUN_ID"], "cme-find-out", True, allow_prior_commit=True)
          print("Run provenance PASS: artifact belongs to this workflow and branch; successful artifact checks remain required.")
          PY
          fi

      - name: Download selected TikTok candidates from FIND run
        if: (inputs.stage == 'all' || inputs.stage == 'analyze') && inputs.candidate_id != ''
        uses: actions/download-artifact@v4
        with:
          name: cme-find-out
          path: find-input
          run-id: ${{ inputs.find_run_id }}
          github-token: ${{ github.token }}

      - name: Install Tesseract OCR for frame QA
        if: (inputs.stage == 'frame' || inputs.stage == 'all') && inputs.no_ocr_required != true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Download atoms from previous Brain run
        if: inputs.stage == 'frame'
        uses: actions/download-artifact@v4
        with:
          name: cme-brain-out
          path: out
          run-id: ${{ inputs.brain_run_id }}
          github-token: ${{ github.token }}

      - name: Download prior frame state for a controlled retry
        if: inputs.stage == 'frame' && inputs.previous_frame_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: cme-frame-out
          path: prior-frame
          run-id: ${{ inputs.previous_frame_run_id }}
          github-token: ${{ github.token }}

      - name: Restore prior frame state and preserve attempt limits
        if: inputs.stage == 'frame' && inputs.previous_frame_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          test -s prior-frame/state.json || { echo "::error::Prior frame artifact has no state.json"; exit 1; }
          python - <<'PY'
          import json
          from pathlib import Path
          brain = json.loads(Path("out/atoms_manifest.json").read_text(encoding="utf-8"))
          prior = json.loads(Path("prior-frame/atoms_manifest.json").read_text(encoding="utf-8"))
          keys = ("schema_version", "offer_id", "atoms_sha256", "offer_fingerprint", "photo_hashes", "contract_id", "requested_shots")
          mismatches = [key for key in keys if brain.get(key) != prior.get(key)]
          if mismatches:
              raise SystemExit("Prior frame belongs to a different Brain contract: " + ", ".join(mismatches))
          PY
          cp -a prior-frame/. out/

      - name: Validate offer and atom manifest before image generation
        if: inputs.stage == 'frame'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from cme.offer import load_offer
          from cme.qa import validate_product_references
          from cme.smoke import validate_atoms_manifest
          offer_path = Path("out/live_offer.json")
          atoms_path = Path("out/atoms.json")
          manifest_path = Path("out/atoms_manifest.json")
          if not offer_path.is_file() or not atoms_path.is_file() or not manifest_path.is_file():
              raise SystemExit("Brain artifact must include live_offer.json, atoms.json, and atoms_manifest.json")
          offer = load_offer(offer_path)
          issues = validate_product_references(offer.photos)
          if issues:
              raise SystemExit("Target-product photo preflight blocked generation: " + "; ".join(issues))
          data = json.loads(atoms_path.read_text(encoding="utf-8"))
          dispatch_inputs = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")).get("inputs") or {}
          requested_shot = int(dispatch_inputs.get("shot") or 1)
          manifest = validate_atoms_manifest(atoms_path, manifest_path, data, offer, shot=requested_shot)
          print(f"Frame preflight PASS: offer={offer.offer_id}; contract={manifest['contract_id']}; target photos verified.")
          PY

      - name: Run controlled live pipeline
        id: smoke
        shell: bash
        run: |
          set +e
          read_brief() {
            python - <<'PY'
          import json, os
          from pathlib import Path
          event_payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          print(str((event_payload.get("inputs") or {}).get("brief") or ""), end="")
          PY
          }
          if [[ "$CME_STAGE" == "find" ]]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          from cme.radar.find import run_find

          keywords = [x.strip() for x in os.environ.get("FIND_KEYWORDS", "").split(",") if x.strip()]
          dispatch_inputs = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8")).get("inputs") or {}
          raw_offer = str(dispatch_inputs.get("offer_json") or "").strip()
          offer_data = json.loads(raw_offer) if raw_offer else {}
          if not isinstance(offer_data, dict):
              raise SystemExit("offer_json must be a JSON object")
          order_mode = os.environ.get("FIND_PERFORMANCE_ORDER", "default")
          performance_order_options = {
              "default": [],
              "play_6s_rate": ["play_6s_rate"],
              "play_2s_rate": ["play_2s_rate"],
              "playback_both": ["play_6s_rate", "play_2s_rate"],
          }
          if order_mode not in performance_order_options:
              raise SystemExit(f"Unknown FIND_PERFORMANCE_ORDER={order_mode!r}")
          performance_order_bys = performance_order_options[order_mode]
          params = {"country": os.environ["FIND_COUNTRY"].upper(),
                    "period": int(os.environ["FIND_PERIOD"]),
                    "max_requests": int(os.environ["FIND_REQUESTS"]),
                    "max_ads": int(os.environ["FIND_MAX_ADS"]),
                    "keywords": keywords, "offer": offer_data, "discovery_mode": "auto",
                    "selection_mode": os.environ.get("FIND_SELECTION_MODE", "product"),
                    "video_duration_range": os.environ.get("FIND_VIDEO_DURATION_RANGE", "all"),
                    "performance_order_bys": performance_order_bys,
                    "include_retention": os.environ.get("FIND_INCLUDE_RETENTION", "false").lower() == "true"}
          try:
              result = run_find(params)
          except Exception as exc:
              out = Path("out")
              out.mkdir(parents=True, exist_ok=True)
              failure_details = getattr(exc, "diagnostics", {}) or {}
              stats = failure_details.get("discovery_stats") or {}
              calls = stats.get("calls") or []
              try:
                  request_count = int(stats.get("executed_requests") or len(calls))
              except (TypeError, ValueError):
                  request_count = len(calls)
              failed_call = calls[-1] if calls and calls[-1].get("request_failed") else {}
              failure_class = "SOCIALCRAWL_REQUEST_FAILED" if failure_details.get("provider") == "SocialCrawl" else "FIND_FAILED"
              diagnostics = {
                  "outcome": "PROVIDER_ERROR" if failure_details.get("provider") == "SocialCrawl" else "FIND_ERROR",
                  "explanation": str(exc)[:1000],
                  "requests_executed": request_count,
                  "failed_call": failed_call,
                  "request_diagnostics": failure_details.get("request") or {},
              }
              failure_result = {
                  "candidates": [],
                  "stats": stats,
                  "request": params,
                  "diagnostics": diagnostics,
              }
              (out / "candidates.json").write_text(json.dumps(failure_result, ensure_ascii=False, indent=2), encoding="utf-8")
              (out / "candidate_summary.json").write_text("[]", encoding="utf-8")
              (out / "run_result.json").write_text(json.dumps({
                  "command": "find", "exit_code": 1, "failure_class": failure_class,
                  "status": "ERROR", "message": str(exc)[:1000], "diagnostics": diagnostics,
              }, ensure_ascii=False, indent=2), encoding="utf-8")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                  summary.write("## FIND failed; diagnostic artifact preserved\n\n")
                  summary.write(f"- Failure: {type(exc).__name__} — {str(exc)[:800]}\n")
                  summary.write(f"- Requests recorded: {request_count}\n")
                  summary.write("- Artifacts: candidates.json, candidate_summary.json, run_result.json.\n\n")
              print(json.dumps(failure_result, ensure_ascii=False, indent=2))
              raise SystemExit(1)
          def mark_find_state_if_executed(result):
              stats = result.get("stats") or {}
              diagnostics = result.get("diagnostics") or {}
              try:
                  request_count = int(diagnostics.get("requests_executed") or stats.get("executed_requests") or 0)
              except (TypeError, ValueError):
                  request_count = 0
              calls = stats.get("calls") or []
              if request_count <= 0 and not calls:
                  return
              state_dir = os.environ.get("CME_FIND_STATE_DIR", "").strip()
              if not state_dir:
                  return
              marker = Path(state_dir) / "find-completed"
              marker.parent.mkdir(parents=True, exist_ok=True)
              marker.write_text("requests=" + str(request_count) + "\n", encoding="utf-8")
          mark_find_state_if_executed(result)
          out = Path("out")
          (out / "candidates.json").write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
          rows = []
          for c in result.get("candidates", []):
              score = c.get("source_score") or {}
              rows.append({"id": c.get("id"), "brand": c.get("brand_name") or c.get("brand"),
                           "title": c.get("title"), "source_url": c.get("source_url"),
                           "video_url_present": bool(c.get("video_url")),
                           "final_score": score.get("final_score") if isinstance(score, dict) else None,
                           "source_check": c.get("source_check"), "stage": c.get("stage"), "source_gate_eligible": c.get("source_gate_eligible"), "analysis_eligibility": c.get("analysis_eligibility") or {}, "target_fit_status": c.get("target_fit_status"), "source_selection": c.get("source_selection") or {},
                           "performance_evidence": c.get("performance_evidence") or {},
                           "commercial_evidence": c.get("commercial_evidence") or {},
                           "playback_metrics": {k: (c.get("metrics") or {}).get(k, {}).get("value")
                                                for k in ("ctr", "cvr", "play_2s_rate", "play_6s_rate")
                                                if k in (c.get("metrics") or {})},
                           "retention_metrics": {
                               k: (c.get("metrics") or {}).get(k, {}).get("value")
                               for k in ("retention_2s", "retention_6s")
                               if k in (c.get("metrics") or {})},
                           "retention_curve_points": (c.get("retention_evidence") or {}).get("curve_point_count", 0),
                           "retention_evidence": c.get("retention_evidence") or {}})
          (out / "candidate_summary.json").write_text(json.dumps(rows, ensure_ascii=False, indent=2), encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as s:
              mode = os.environ["CME_STAGE"]
              s.write("## TikTok FIND results\n\n")
              s.write(f"Mode: {params.get('selection_mode', 'product')} · Country: {params['country']} · Period: {params['period']} days · Request cap: {params['max_requests']} · Candidate cap: {params['max_ads']} · Keywords: {', '.join(keywords) or 'none'}\n\n")
              if not rows:
                  stats = result.get("stats") or {}
                  diag = result.get("diagnostics") or {}
                  queries = diag.get("search_queries_executed") or []
                  if diag.get("outcome") == "INPUT_CONFLICT":
                      s.write(f"FIND stopped before provider calls: {diag.get('explanation', 'input conflict')}\n\n")
                  elif diag.get("raw_ads_returned", 0):
                      s.write(f"SocialCrawl returned {diag['raw_ads_returned']} raw ad row(s), but none passed the target-source selection rules.\n\n")
                  else:
                      s.write("SocialCrawl returned no raw ad rows for the planned source queries.\n\n")
                  s.write(f"Diagnosis: `{diag.get('outcome', 'UNKNOWN')}` — {diag.get('explanation', 'No additional FIND diagnostics available')}\n\n")
                  s.write(f"Requests: {diag.get('requests_executed', 0)}; unique ads: {diag.get('unique_ads', 0)}; product-relevant: {diag.get('product_relevant_ads', diag.get('target_relevant_ads', 0))}; performance-ready: {diag.get('performance_ready_source_ads', 0)}; shortlisted: {diag.get('auto_shortlist_ads', 0)}; source-money-gate pass (not revenue): {diag.get('money_ready_source_ads', 0)}; hard-excluded: {diag.get('hard_excluded_ads', 0)}.\n\n")
                  retention_diag = diag.get("retention_selection") or stats.get("retention_selection") or {}
                  if retention_diag.get("retention_calls"):
                      returned = retention_diag.get("returned_rows_with_retention") or {}
                      s.write(
                          f"Retention capture: calls={retention_diag.get('retention_calls', 0)}; "
                          f"2s points={returned.get('retention_2s', 0)}; "
                          f"6s points={returned.get('retention_6s', 0)}; "
                          f"curves={returned.get('retention_curve', 0)}; "
                          f"shortlisted with retention={retention_diag.get('selected_candidates_with_retention', 0)}.\n"
                          "Exact numeric play_2s_rate/play_6s_rate values are not published by SocialCrawl; "
                          "retention points are not the exact board score or proof of sales.\n\n"
                      )
                  selection_diag = diag.get("source_selection_diagnostics") or {}
                  by_reason = selection_diag.get("by_reason") or {}
                  if by_reason:
                      s.write("Source-selection outcomes: " + "; ".join(f"{name}={count}" for name, count in sorted(by_reason.items())) + "\n\n")
                      for item in (selection_diag.get("examples") or [])[:6]:
                          title = str(item.get("title") or "(no title)").replace("\n", " ")[:120]
                          url = item.get("source_url") if str(item.get("source_url") or "").startswith("https://") else ""
                          s.write(f"- {item.get('ad_id')} — {item.get('reason')}; {title}; action={item.get('action')}; money_gate={item.get('money_gate_pass')}; performance={item.get('performance_basis', 'unknown')}:{item.get('performance_fields') or []}; performance_score={item.get('performance_score')}; [open ad]({url})\n")
                      s.write("\n")
                  if queries:
                      s.write("Sponsored Search queries tried: " + ", ".join(queries) + "\n\n")
              for c in rows:
                  title = str(c.get("title") or "(no title)").replace("\n", " ")[:160]
                  brand = str(c.get("brand") or "unknown brand")[:80]
                  url = c.get("source_url") if isinstance(c.get("source_url"), str) and str(c.get("source_url")).startswith("https://") else ""
                  s.write(f"- `candidate_id: {c['id']}` — {brand}: {title}; score={c.get('final_score')}; video={'yes' if c.get('video_url_present') else 'no'}; performance={(c.get('performance_evidence') or {}).get('basis', 'unknown')}; commercial_evidence={(c.get('commercial_evidence') or {}).get('level', 'unknown')}; playback={c.get('playback_metrics') or {}}; [open ad]({url})\n")
              if mode == "find":
                  if params.get("selection_mode") == "mechanism":
                      s.write("\nFIND results are PATTERN_SOURCE_V1 analysis candidates, not commercial approval; attention is a proxy only and Target-Fit remains NOT_EVALUATED. Use this run ID plus an explicit candidate_id for stage=analyze.\n")
                  else:
                      s.write("\nManual choice: run stage=all with this run ID and the selected candidate_id.\n")
              else:
                  s.write("\nFIND records PATTERN_SOURCE_V1 eligibility after source-role, promotion, query, attention and explicit operator filters. ALL consumes the same eligible shortlist in FIND order; commercial metrics and scorer actions are diagnostics only. Target-Fit decides transferability. A manually supplied candidate_id selects one FIND source but cannot bypass PATTERN_SOURCE_V1.\n")
          print(f"FIND finished: {len(rows)} candidate(s).")
          PY
          elif [[ "$CME_STAGE" == "analyze" ]]; then
            python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          from cme.radar.server import ROOT, RadarApp
          from cme.radar.select import pattern_source_reason
          from cme.radar.source_loop import analyze_with_invalid_output_retry

          out = Path("out").resolve()
          run_id = os.environ.get("FIND_RUN_ID", "").strip()
          cid = os.environ.get("CANDIDATE_ID", "").strip()
          candidates_file = Path("find-input/candidates.json")
          if not candidates_file.is_file():
              raise SystemExit("FIND artifact lacks candidates.json")
          candidates = json.loads(candidates_file.read_text(encoding="utf-8")).get("candidates", [])
          candidate = next((c for c in candidates if c.get("id") == cid), None)
          if candidate is None:
              raise SystemExit(f"candidate_id {cid!r} is not in FIND run {run_id}")
          reason = pattern_source_reason(candidate)
          if reason:
              raise SystemExit(f"Candidate cannot be used for pattern extraction ({reason}); no Analyst call was made.")

          score = candidate.get("source_score") or {}
          score = score if isinstance(score, dict) else {}
          components = score.get("components") or {}
          components = components if isinstance(components, dict) else {}
          gate = components.get("money_signal_gate") or {}
          gate = gate if isinstance(gate, dict) else {}
          out_selected = {"candidate_id": cid, "stage": "analyze", "decision": "PATTERN_EXTRACTION_ONLY",
                          "source_use_policy": "PATTERN_EXTRACTION_NOT_COMMERCIAL_APPROVAL",
                          "brand": candidate.get("brand_name") or candidate.get("brand"),
                          "title": candidate.get("title"), "source_url": candidate.get("source_url"),
                          "source_check": candidate.get("source_check"), "source_score": score}
          (out / "selected_candidate.json").write_text(json.dumps(out_selected, ensure_ascii=False, indent=2), encoding="utf-8")

          work = Path("radar-work").resolve()
          if work.exists():
              shutil.rmtree(work)
          app = RadarApp(work, settings_path=ROOT / "settings.json", catalog_path=ROOT / "adapters.json",
                         offer_path=out / "unused-analysis-offer.json", vertical_path=ROOT / "verticals" / "physical_goods_us.json",
                         production_shots=1)
          try:
              app.store.ingest([candidate], "github-find-" + run_id, "found")
              app.store.decide(cid, "shortlist", "Selected manually from GitHub Actions FIND")
              statuses = analyze_with_invalid_output_retry(lambda: app.do_analyze(cid), max_retries=1)
              attempt_rows = []
              status = statuses[-1] if statuses else {"status": "UNKNOWN", "detail": "no analysis attempt returned"}
              saved_rows = app.store.analyses(cid)
              saved = saved_rows[0] if saved_rows else {}
              for index, item in enumerate(statuses, start=1):
                  attempt_rows.append({
                      "candidate_id": cid,
                      "attempt": index,
                      "analysis_id": item.get("analysis_id"),
                      "status": str(item.get("status") or "UNKNOWN").upper(),
                      "detail": str(item.get("detail") or "")[:500],
                      "same_candidate_retry": index > 1,
                  })
              attempt_artifact = {"selection_mode": "manual_from_prior_find", "candidate_id": cid,
                                  "max_attempts": 2, "attempts": attempt_rows,
                                  "selected_candidate_id": cid if status.get("status") == "OK" else None}
              (out / "source_analysis_attempts.json").write_text(
                  json.dumps(attempt_artifact, ensure_ascii=False, indent=2), encoding="utf-8")
              calls_path = work / "calls.jsonl"
              if calls_path.is_file():
                  shutil.copy2(calls_path, out / "radar-analysis-calls.jsonl")

